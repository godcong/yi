name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .skill files
        run: python3 scripts/build_skill.py --dist dist/ --skill-dir skills/daily-hexagram --output dist/

      - name: Update skills.json checksums
        run: python3 scripts/update_skills_json.py --dist dist/ --skills-json skills.json --version ${{ github.ref_name }}

      - name: Upload .skill files and skills.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*.skill; do
            echo "Uploading $f..."
            gh release upload ${{ github.ref_name }} "$f" --clobber
          done
          echo "Uploading skills.json..."
          gh release upload ${{ github.ref_name }} skills.json --clobber
